id: HANDOVER_VALIDATION_STAGE
type: invariant
scope: governance_engine
description: >
  HANDOVER validation MUST execute as a governance validation stage before execution resumes.

enforces_rules:
  - HANDOVER_VALIDATED_ON_RESUME
  - CANON_HASH_MATCH_ON_RESUME
  - NO_EXEC_WITHOUT_DEEP_REENTRY

supports_intents:
  - INTENT_SESSION_REHYDRATION
  - INTENT_NO_CONTEXT_DRIFT
  - INTENT_DETERMINISTIC_EXECUTION

derives_from_axioms:
  - AXIOM_DETERMINISM
