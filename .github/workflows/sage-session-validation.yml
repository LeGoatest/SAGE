name: SAGE Session Continuity Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  session_validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate HANDOVER for session continuity
        run: |
          python tools/ci/validate_jtasks_integrity.py .
