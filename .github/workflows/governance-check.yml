name: Constitutional Governance Check

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install pyyaml jsonschema

      - name: Canon Boot Validation
        run: python .governance/boot_validator.py

      - name: Validate Constitutional Graph
        run: python .governance/invariant_validator.py

      - name: Semantic Conflict Detection
        run: python .governance/semantic_conflict_validator.py

      - name: Run Governance Validator
        run: python .governance/validator.py
